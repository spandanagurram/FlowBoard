services:
  postgres:
    image: postgres:17
    container_name: flowboard_postgres
    environment:
      POSTGRES_DB: flowboard
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flowboard_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
