<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Workspace Invitation</title>
</head>
<body style="margin:0; padding:40px; background-color:#f4f4f5; font-family:Arial, sans-serif;">

    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
    >
        <tr>
            <td align="center">

                <table
                    role="presentation"
                    width="600"
                    cellspacing="0"
                    cellpadding="0"
                    style="background:#ffffff; border-radius:8px; padding:40px;"
                >

                    <tr>
                        <td align="center">
                            <h1 style="margin:0; color:#2563eb;">
                                FlowBoard
                            </h1>

                            <p style="font-size:20px; margin-top:24px;">
                                You've been invited!
                            </p>

                            <p>
                                <strong>{{ inviter_name }}</strong>
                                invited you to join
                            </p>

                            <h2 style="margin-top:10px;">
                                {{ workspace_name }}
                            </h2>

                            <p style="margin:30px 0;">
                                <a
                                    href="{{ invitation_url }}"
                                    style="
                                        background:#2563eb;
                                        color:#ffffff;
                                        text-decoration:none;
                                        padding:12px 24px;
                                        border-radius:6px;
                                        display:inline-block;
                                    "
                                >
                                    Accept Invitation
                                </a>
                            </p>

                            <p style="color:#666666;">
                                This invitation expires in 7 days.
                            </p>

                            <hr>

                            <p style="font-size:12px; color:#888888;">
                                If you weren't expecting this invitation,
                                you can safely ignore this email.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
