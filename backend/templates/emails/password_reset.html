<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset your FlowBoard password</title>
</head>
<body style="margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; font-family: Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width: 600px; background: #ffffff; border-radius: 12px; padding: 40px;">
                    <tr>
                        <td>
                            <h1 style="margin: 0 0 16px; font-size: 24px;">Reset your password</h1>
                            <p style="margin: 0 0 24px; color: #475569; line-height: 1.5;">We received a request to reset your FlowBoard password. Use the button below to choose a new password.</p>
                            <p style="margin: 0 0 24px;"><a href="{{ reset_url }}" style="display: inline-block; background: #2563eb; border-radius: 8px; color: #ffffff; padding: 12px 20px; text-decoration: none;">Reset Password</a></p>
                            <p style="margin: 0; color: #64748b; font-size: 14px; line-height: 1.5;">If you did not request a password reset, you can safely ignore this email.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
